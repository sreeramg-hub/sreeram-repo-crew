name: crew-verify

# After every merge to main: wait for the production deploy, smoke-test the live site, and tell you.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  deployments: read

jobs:
  verify:
    uses: sreeramg-hub/sreeram-repo-crew/.github/workflows/verifier.yml@main
