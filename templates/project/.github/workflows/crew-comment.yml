name: crew-comment

# Your replies drive the crew: answer the weekly proposals issue, or comment /scout, /review, /fix <text>.
# Comments from anyone other than the repository owner never start a job.

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  issues: write
  pull-requests: write
  contents: read

jobs:
  comment:
    if: github.event.comment.user.login == github.repository_owner
    uses: sreeramg-hub/sreeram-repo-crew/.github/workflows/comment.yml@main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
